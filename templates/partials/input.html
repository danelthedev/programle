{{define "input"}}
<div class="w-full max-w-2xl">
  <div class="relative">
    <input id="guessInput" type="text" placeholder="Type or click to see languages..." autocomplete="off" class="input input-bordered w-full font-mono">
    <div id="options" class="absolute z-10 bg-base-200 w-full rounded-box shadow-lg max-h-60 overflow-y-auto border border-base-100 p-1 hidden top-full mt-1"></div>
  </div>
  <button id="submitBtn" class="btn btn-primary w-full mt-2 font-mono">GUESS</button>
  <p id="message" class="text-center font-mono text-sm mt-2 min-h-5"></p>
  <button id="restartBtn" class="btn btn-ghost w-full mt-1 font-mono hidden">Play again</button>
</div>
{{end}}
