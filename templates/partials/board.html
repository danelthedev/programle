{{define "board"}}
<div class="card bg-base-200 w-full max-w-2xl shadow-xl border border-base-100">
  <div class="card-body p-4">
    <div class="flex justify-between items-center mb-2">
      <button id="prevBtn" class="btn btn-xs">‹</button>
      <span id="snippetIdx" class="font-mono text-xs opacity-60"></span>
      <button id="nextBtn" class="btn btn-xs">›</button>
    </div>
    <pre class="overflow-x-auto snippet-scroll"><code id="snippet" class="font-mono text-sm whitespace-pre-wrap break-words"></code></pre>
  </div>
</div>
{{end}}
